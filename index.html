<!doctype html>
<html>

<head>
    <title>Cove of Death - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>Cove of Death</h1>

        <img
            src="https://i.insider.com/565b1cf6dd08955b3f8b4594?width=960&format=jpeg"
            alt="Cove"
        >

        <h2>Restricted Area</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">Enter</button>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
